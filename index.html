<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Clientes - Loja de Tintas Criador Douglas Fraga</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- TRAVA DE SEGURANÇA: Se não estiver logado, volta para o login -->
    <script>
        if (!sessionStorage.getItem('usuarioLogado')) {
            window.location.href = 'login.html';
        }
    </script>

    <style>
        /* Adiciona automaticamente o símbolo R$ antes de qualquer valor na quarta coluna da tabela */
        #tabela-clientes tbody tr td:nth-child(4)::before {
            content: "R$ ";
            font-weight: bold;
        }

        /* --- ESTILIZAÇÃO DO FUNDO PRINCIPAL --- */
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            margin: 0;
            position: relative;
        }

        /* Estrutura para fixar a logo oficial bem CENTRALIZADA ao fundo */
        .fundo-logo-Ampla {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Centralização perfeita nos eixos X e Y */
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 650px; /* Altere para aumentar ou diminuir o tamanho da imagem de fundo */
            opacity: 0.18; /* Opacidade sutil para os dados da tabela ficarem legíveis */
            z-index: -1; 
            pointer-events: none;
            user-select: none;
        }

        /* Garante as proporções ideais da imagem sem distorção */
        .fundo-logo-Ampla img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* Ajustes de transparência para os blocos revelarem o fundo nítido */
        .container {
            position: relative;
            z-index: 2;
        }
        
        .tabela-container, .painel-controle, .card-upload, .card-mini {
            background-color: rgba(255, 255, 255, 0.85) !important; 
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body>

    <!-- LOGOTIPO DA AMPLA OFICIAL CENTRALIZADO NO PLANO DE FUNDO -->
    <div class="fundo-logo-Ampla">
        <img src="logo.png" alt="Logo Ampla Materiais de Construção">
    </div>
    
    <!-- Barra de Ferramentas Superior -->
    <nav class="sistema-nav" style="position: relative; z-index: 10;">
        <div class="nav-brand">🎨 Sistema Criado Douglas Fraga</div>
        <div class="nav-actions" style="display: flex; gap: 10px; align-items: center;">
            <button id="btn-config-senha" class="btn-admin" onclick="abrirConfigSenha()" style="background: #ffc107; color: #000; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">⚙️ Alterar Senhas</button>
            <button onclick="fazerLogout()" style="background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">Sair</button>
        </div>
    </nav>

    <div class="container">
        <!-- Painel de Controle de Arquivos -->
        <div class="painel-controle">
            <div class="card-upload">
                <h3>📥 Importar Abaixo</h3>
                <p>Selecione seu arquivo Excel <strong></strong></p>
                
                <input type="file" id="arquivo-csv" accept=".csv" style="display: none;">
                
                <label for="arquivo-csv" style="display: inline-block; background-color: #28a745; color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: background 0.2s;">
                    📁 Carregar arquivo
                </label>
            </div>

            <!-- Cartões de Estatísticas Rápidas -->
            <div class="cards-status">
                <div class="card-mini">
                    <span class="titulo-mini">Total de Clientes</span>
                    <span id="stat-clientes" class="valor-mini">0</span>
                </div>
                <div class="card-mini">
                    <span class="titulo-mini">Produtos Cadastrados</span>
                    <span id="stat-produtos" class="valor-mini">0</span>
                </div>
            </div>
        </div>

        <!-- Barra de Pesquisa Dinâmica -->
        <div class="secao-busca">
            <input type="text" id="campo-pesquisa" placeholder="🔍 Digite o Nome, CPF ou Produto para buscar na base..." disabled>
        </div>

        <!-- Tabela de Dados Simplificada -->
        <div class="tabela-container">
            <table id="tabela-clientes">
                <thead>
                    <tr>
                        <th>Cliente / Nome</th>
                        <th>CPF / CNPJ</th>
                        <th>Produtos Comprados</th>
                        <th>Total em Compras</th>
                        <th>Data da Compra</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela">
                    <tr>
                        <td colspan="5" class="tabela-vazia">Nenhum arquivo importado. Selecione um arquivo CSV acima para começar.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal de Alteração de Senha -->
    <div id="modalSenha" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; padding: 25px; border-radius: 8px; width: 300px; color: #333;">
            <h3 style="margin-top: 0;">Alterar Senhas do Sistema</h3>
            
            <label style="display:block; margin-top:10px;">Nova Senha do ADMIN:</label>
            <input type="password" id="nova-senha-admin" style="width:100%; padding:6px; margin-top:5px; box-sizing:border-box;">
            
            <label style="display:block; margin-top:15px;">Nova Senha do Ampla:</label>
            <input type="password" id="nova-senha-Ampla" style="width:100%; padding:6px; margin-top:5px; box-sizing:border-box;">
            
            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="fecharConfigSenha()" style="padding: 6px 12px; background: #bbb; border:none; border-radius:4px; cursor:pointer;">Cancelar</button>
                <button onclick="salvarNovasSenhas()" style="padding: 6px 12px; background: #28a745; color:white; border:none; border-radius:4px; cursor:pointer;">Salvar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    
    <!-- Lógica de Controle de Acesso e Logout da Página -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const tipoUsuario = sessionStorage.getItem('usuarioLogado');

            // Se for o usuário Ampla, esconde o botão de alterar senhas
            if (tipoUsuario === 'Ampla') {
                const elementosAdmin = document.querySelectorAll('.btn-admin');
                elementosAdmin.forEach(function(el) {
                    el.style.display = 'none';
                });
            }
        });

        function abrirConfigSenha() {
            document.getElementById('modalSenha').style.display = 'flex';
        }

        function fecharConfigSenha() {
            document.getElementById('modalSenha').style.display = 'none';
        }

        function salvarNovasSenhas() {
            const novaAdmin = document.getElementById('nova-senha-admin').value;
            const novaAmpla = document.getElementById('nova-senha-Ampla').value;

            if (novaAdmin.trim() !== "") {
                localStorage.setItem('senha_admin', novaAdmin);
            }
            if (novaAmpla.trim() !== "") {
                localStorage.setItem('senha_Ampla', novaAmpla);
            }

            alert('Senhas atualizadas com sucesso!');
            fecharConfigSenha();
        }

        function fazerLogout() {
            sessionStorage.removeItem('usuarioLogado');
            window.location.replace('login.html');
        }
    </script>
</body>
</html>
